# Supabase CLI configuration for local development and `supabase db push`.
# Production schema is applied via supabase/migrations/*.sql (see README).
project_id = "refilwe-molapisi-portfolio"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "8MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
